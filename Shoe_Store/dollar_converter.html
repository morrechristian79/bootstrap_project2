<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Sofia&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Sofia&display=swap" rel="stylesheet">
    <title>DOLLAR TO PESO</title>
    <style>
        body {
            font-family: "Iosevka Charon Mono", monospace;
            /* max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px; */
        }
        :root {
            /* Colors */
            --primary-color: #7b80a8;
            --secondary-color: #f3961c;
            --dark-color: #252525;
            --white-color: #fff;
            --light-gray-color: #f2f2f2;
            --labor-services-color: #273071;
            /* --background-image: url("Header_photo.webp"); */
            --black-color: #050505;
            --header-color: #878a81;
            --secondary-background: #9c9f96;
            --margin-bottom: 16px;
            --site-max-width: 100%;
            --spacing:4px;
        }
        * {
            box-sizing: border-box;
            /* font-family: Arial, Helvetica, sans-serif; */
        }
        header {
          position: absolute;
          top: calc(var(--spacing) * 5);
          left: calc(var(--spacing) * 12);
          right: calc(var(--spacing) * 12);
          height: calc(var(--spacing) * 12);
          padding: 0px 40px;
          background: var(--secondary-background);
          border-radius: 10px;
          justify-content: center;
          display: flex;
          align-items: center;
        }

    </style>
</head>
<body>
    <header>
      <div>
        <h2 class="project-title">Ian's Shop</h2>
      </div>
      <!-- BURGER BUTTON -->
      <button class="burger-button" id="burgerBtn">☰</button>

      <nav class="menu-box" id="menuBox">
        <a href="shopall.html">ALL SHOES</a>
        <a href="for_men.html">FOR MEN</a>
        <a href="for_women.html">FOR WOMEN</a>
      </nav>
    </header>
    
    <main class="converter">
        
    <h2>USD to PHP Converter</h2>

        <label for="usdAmount">US Dollar Amount</label>
        <input
            type="number"
            id="usdAmount"
            min="0"
            step="0.01"
            placeholder="e.g. 100"
        />

        <label for="exchangeRate">Exchange Rate</label>
        <input
            type="number"
            id="exchangeRate"
            min="0"
            step="0.01"
            placeholder="Enter the current USD to PHP rate"
        />

        <button type="button" id="convertBtn">Convert to Peso</button>

        <div id="conversionResult" aria-live="polite"></div>

    </main>
</body>
</html>
