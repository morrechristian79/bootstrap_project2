<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Sofia&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Sofia&display=swap" rel="stylesheet">
    
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: "Iosevka Charon Mono", monospace;
            /* max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px; */
        }
        :root {
        /* Colors */
        --primary-color: #7b80a8;
        --secondary-color: #f3961c;
        --dark-color: #252525;
        --white-color: #fff;
        --light-gray-color: #f2f2f2;
        --labor-services-color: #273071;
        /* --background-image: url("Header_photo.webp"); */
        --black-color: #050505;
        --header-color: #878a81;
        --secondary-background: #9c9f96;
        --margin-bottom: 16px;
        --site-max-width: 100%;
        --spacing:4px;
        }
    * {
            box-sizing: border-box;
            /* font-family: Arial, Helvetica, sans-serif; */
        }
        html, body {
      /* width: 100%; */
      /* height: 1000px; */
            min-height: 100vh;
            padding: 20px;
        }
        header {
          position: absolute;
          top: calc(var(--spacing) * 5);
          left: calc(var(--spacing) * 12);
          right: calc(var(--spacing) * 12);
          height: calc(var(--spacing) * 12);
          padding: 0px 40px;

          background: var(--secondary-background);
          border-radius: 10px;
          justify-content: center;
          display: flex;
          align-items: center;

      }

      .project-title {
              margin: 0;
              font-family: "sofia", cursive;
          }
          .menu-box {
              display: flex;
              gap: 20px;
              font-family: sans-serif;
              font-size: large;

              /* padding: 10px 15px; */
              margin: auto;
              align-items: center;
             }
          .menu-box a {
              text-decoration: none;
              color: #252525;
              font-family: "Iosevka Charon Mono", monospace;
              font-weight: 500;
          }

          .menu-box a:hover {
              /* background-color: blue; */
              color: white;
          }

          .burger-button {
              display: none;
              background: none;
              border: none;
              font-size: 30px;
              cursor: pointer;
              color: #252525;
          }
          
        input,select,button {
            margin: 10px 0;
            display: block;
            padding: 8px;
            width: 100%;
        }

        input {
            margin: 10px 0;
            display: block;
            padding: 8px;
            width: 380px;
        }

        label,input, button {
            display: block;
            width: 100%;
            margin: 10px 0;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        .calculator {
            width: 90%;
            max-width: 400px;
            margin: 120px auto 0;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .converter {
            width: 90%;
            max-width: 400px;
            margin: 120px auto 0;
            padding: 25px;

            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .converter h2 {
            margin: 0 0 20px;
            text-align: center;
        }

        .converter label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        .converter input, .converter button {
            display: block;
            width: 100%;
            padding: 12px;

            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        .converter button {
            margin-top: 20px;
            background-color: #273071;
            color: white;
            border: none;
            cursor: pointer;
        }

        .converter button:hover {
            background-color: #7b80a8;
        }

        #conversionResult {
            min-height: 48px;
            margin-top: 20px;
            padding: 14px;

            background-color: #f1f1f1;
            border-radius: 5px;

            font-size: 18px;
            text-align: center;
        }

    @media screen and (max-width: 900px) {

        header {
            top: calc(var(--spacing) * 4);
            left: calc(var(--spacing) * 6);
            right: calc(var(--spacing) * 6);
            height: auto;
            min-height: 60px;
            padding: 10px 25px;
            justify-content: space-between;
        }

        /* Show burger button */
        .burger-button {
            display: block;
            width: auto;
            margin: 0;
            padding: 5px;
        }
/* Hide menu initially */
        .menu-box {
            display: none;
            width: 100%;
            margin: 10px 0 0;
            padding: 15px;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
            background-color: var(--secondary-background);
            border-radius: 0 0 10px 10px;
        }

        /* JavaScript adds the "active" class */
        .menu-box.active {
            display: flex;
        }

        .menu-box a {
            width: 100%;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .menu-box a:hover {
            background-color: var(--primary-color);
            color: white;
        }
        .project-title {
            font-size: 24px;
        }

        .menu-box {
            gap: 12px;
            margin: 0;
            font-size: 16px;
        }

        .calculator, .converter {
            width: calc(100% - 40px);
            max-width: 400px;
            margin-top: 110px;
        }

        input {
            width: 100%;
        }
    }
    
    @media screen and (max-width: 600px) {

        header {
            top: 10px;
            left: 10px;
            right: 10px;
            min-height: 60px;
            padding: 10px 15px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .project-title {
            font-size: 21px;
        }

        /* Show burger button */
        .burger-button {
            display: block;
            width: auto;
            margin: 0;
            padding: 5px;
        }

        /* Hide menu initially */
        .menu-box {
            display: none;
            width: 100%;
            margin: 10px 0 0;
            padding: 15px;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
            background-color: var(--secondary-background);
            border-radius: 0 0 10px 10px;
        }

        /* JavaScript adds the "active" class */
        .menu-box.active {
            display: flex;
        }

        .menu-box a {
            width: 100%;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .menu-box a:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .calculator, .converter {
            width: calc(100% - 30px);
            max-width: none;
            margin: 100px auto 0;
            padding: 18px;
        }

        .converter h2 {
            font-size: 22px;
        }

        .converter input, .converter select, .converter button {
            width: 100%;
            padding: 11px;
            font-size: 16px;
        }

        #conversionResult {
            padding: 12px;
            font-size: 16px;
        }
    }
    </style>
</head>
<body>

    <header>
      <div>
        <h2 class="project-title">Ian's Shop</h2>
      </div>
      <!-- BURGER BUTTON -->
      <button class="burger-button" id="burgerBtn">☰</button>

      <nav class="menu-box" id="menuBox">
        <a href="index.html">MAIN</a>
        <a href="shopall.html">ALL SHOES</a>
        <a href="for_men.html">FOR MEN</a>
        <a href="for_women.html">FOR WOMEN</a>
      </nav>
    </header>

    <main class="calculator">
        <h2>Simple Interest Calculator (10%)</h2>    

        <label for="principal">Enter Principal Amount : </label>
        <input type="number" id="principal" placeholder="e.g. 1000">

        <label for="years">Number of Years :</label>
        <input type="number" id="years" placeholder="e.g. 3">

        <button id="calculateBtn">Calculate</button>

        <div id="result"></div>
    </main>

    <section class="converter">
        
    <h2>USD to PHP Converter</h2>

        <label for="usdAmount">US Dollar Amount</label>
        <input
            type="number"
            id="usdAmount"
            min="0"
            step="0.01"
            placeholder="e.g. 100"
        />

        <label for="exchangeRate">Exchange Rate</label>
        <input
            type="number"
            id="exchangeRate"
            min="0"
            step="0.01"
            placeholder="Enter the current USD to PHP rate"
        />

        <button type="button" id="convertBtn">Convert to Peso</button>

        <div id="conversionResult" aria-live="polite"></div>

    </section>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const button = document.getElementById("calculateBtn");

            button.addEventListener('click', function() {
                const principal = parseFloat(document.getElementById("principal").value);
                const years = parseInt(document.getElementById("years").value);
                const rate = 10; //10% per year

                const resultDiv = document.getElementById("result");

                if (isNaN(principal) || isNaN(years)) {
                    resultDiv.innerText = "Please enter valid numbers: ";
                    return; //isNan is abbv of Is Not A Number
                }

                const totalAmount = principal * (1 + (rate / 100)* years);
                const interest = totalAmount - principal;

                resultDiv.innerHTML = `
                Interest: ₱${interest.toFixed(2)} <br>
                Total Amount after ${years} years: ₱${totalAmount.toFixed(2)}`;
            });
        });
    const usdAmountInput = document.getElementById("usdAmount");
    const exchangeRateInput = document.getElementById("exchangeRate");
    const convertBtn = document.getElementById("convertBtn");
    const conversionResult = document.getElementById("conversionResult");

    convertBtn.addEventListener("click", function () {
    const usdAmount = Number(usdAmountInput.value);
    const exchangeRate = Number(exchangeRateInput.value);

    if (usdAmountInput.value === "" || usdAmount <= 0) {
      conversionResult.textContent = "Please enter a valid dollar amount.";
      return;
    }

    if (exchangeRateInput.value === "" || exchangeRate <= 0) {
      conversionResult.textContent = "Please enter a valid exchange rate.";
      return;
    }

    const pesoAmount = usdAmount * exchangeRate;

    const formattedUSD = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    }).format(usdAmount);

    const formattedPHP = new Intl.NumberFormat("en-PH", {
      style: "currency",
      currency: "PHP"
    }).format(pesoAmount);

    conversionResult.innerHTML = `
      <strong>${formattedUSD}</strong><br>
      is equal to<br>
      <strong>${formattedPHP}</strong>
    `;
    
        });
        const burgerBtn = document.getElementById('burgerBtn');
        const menuBox = document.getElementById('menuBox');

        burgerBtn.addEventListener('click', function() {
            menuBox.classList.toggle('active');
        })
        
    </script>
</body>
</html>
